<?xml-stylesheet type="text/css" href="style.css"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" class="solid-icon">
<title>Dipole–dipole interaction</title>
<desc>Two polar molecules align their delta-positive and delta-negative ends. Separated dashes distinguish intermolecular attraction from solid internal bonds.</desc>
<defs>
