<?xml-stylesheet type="text/css" href="style.css"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" class="line-icon">
<title>London dispersion force</title>
<desc>Two neutral atoms have momentarily asymmetric electron clouds. A temporary dipole induces a complementary neighboring dipole, with partial charges and a dashed attraction connector.</desc>
<defs>
