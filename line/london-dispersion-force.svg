<path id="delta" d="M-8-24C-16-28-27-26-25-20C-23-15-14-13-10-7C-26-13-33-2-29 9C-25 20-8 19-4 9C1-4-13-17-19-20M-10-7C-4-1-5 12-15 13C-27 14-29-6-17-8"/>
<g id="partial-minus">
<use href="#delta"/>
<path d="M6-8H26"/>
</g>
<g id="partial-plus">
<use href="#delta"/>
<path d="M6-8H26M16-18V2"/>
</g>
</defs>
<use href="#cloud"/>
<use href="#cloud" transform="translate(256 0)"/>
<use href="#partial-minus" transform="translate(80 232)"/>
<use href="#partial-plus" transform="translate(184 232)"/>
<use href="#partial-minus" transform="translate(336 232)"/>
<use href="#partial-plus" transform="translate(440 232)"/>
