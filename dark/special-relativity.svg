<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Special relativity</title>
<desc>Matching luminous blue mirror pairs form stationary and moving light clocks. Amber vertical and diagonal reflected light paths illustrate time dilation in the stationary reference frame. A violet-to-blue arrow indicates motion, with no curved spacetime.</desc>
