<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Metallic bond</title>
<desc>Luminous coral positive metal-ion cores form a regular array inside a shared translucent blue region. Twelve gold electron dots depict the delocalized electron sea, without connecting rods or a background.</desc>
<defs>
