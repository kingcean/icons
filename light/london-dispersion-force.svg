<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>London dispersion force</title>
<desc>Translucent asymmetric blue and teal electron clouds depict a temporary dipole and its induced neighbor. Violet delta-minus and amber delta-plus symbols indicate partial charges; amber dashes mark weak attraction.</desc>
<defs>
<path id="cloud" d="M128 120C60 108 24 164 24 232C24 312 64 384 136 392C200 400 232 348 232 276C232 204 196 132 128 120Z"/>
<path id="delta" fill-rule="evenodd" d="M-10-28C-14-28-22-29-24-24C-26-19-19-15-14-12C-24-12-30-5-30 4C-30 16-8 18-5 7C-2-4-13-16-18-20C-21-23-17-24-10-22Q-4-21-5-25Q-6-28-10-28ZM-17-7C-8-7-6 11-17 11C-28 11-27-7-17-7Z"/>
<g id="partial-minus">
<use href="#delta"/>
<rect x="4" y="-10" width="20" height="8" rx="4"/>
</g>
<g id="partial-plus">
<use href="#delta"/>
<path d="M10-16Q10-20 14-20Q18-20 18-16V-10H24Q28-10 28-6Q28-2 24-2H18V4Q18 8 14 8Q10 8 10 4V-2H4Q0-2 0-6Q0-10 4-10H10Z"/>
</g>
</defs>
<use href="#cloud" fill="#357CB9" fill-opacity="0.24" stroke="#357CB9" stroke-width="8"/>
<use href="#cloud" transform="translate(256 0)" fill="#008F96" fill-opacity="0.24" stroke="#008F96" stroke-width="8"/>
<g fill="#7351BA">
<use href="#partial-minus" transform="translate(80 232)"/>
<use href="#partial-minus" transform="translate(336 232)"/>
</g>
<g fill="#B7790C">
<use href="#partial-plus" transform="translate(184 232)"/>
<use href="#partial-plus" transform="translate(440 232)"/>
<rect x="242" y="258" width="10" height="12" rx="5"/>
<rect x="260" y="258" width="10" height="12" rx="5"/>
</g>
<g fill="#D85865">
<circle cx="140" cy="300" r="24"/>
<circle cx="396" cy="300" r="24"/>
</g>
</svg>