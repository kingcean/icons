<stop offset="1" stop-color="#357CB9"/>
</linearGradient>
<path id="incoming" d="M19 173C38 140 58 140 77 173S98 200 115 173S154 140 173 173S194 200 211 173Q213 170 216 170H281L274 163A6 6 0 0 1 282 155L300 172Q304 176 300 180L282 197A6 6 0 0 1 274 189L281 182H216C198 214 178 211 163 179S142 152 125 179S86 212 67 179S46 152 29 179A6 6 0 0 1 19 173Z"/>
