<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Radiation pressure force</title>
<desc>Blue incoming light packets strike a silver-blue reflective sail. Violet reflected paths return away from the sail, while an amber arrow shows rightward radiation pressure.</desc>
<defs>
