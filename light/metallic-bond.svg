<circle r="36" fill="#D85865"/>
<path fill="#FFF0F1" d="M-6-18H6V-6H18V6H6V18H-6V6H-18V-6H-6Z"/>
</g>
<g id="electrons" fill="#B7790C">
<circle cx="80" cy="120" r="12"/>
<circle cx="192" cy="120" r="12"/>
<circle cx="320" cy="120" r="12"/>
<circle cx="432" cy="120" r="12"/>
<circle cx="64" cy="256" r="12"/>
<circle cx="176" cy="256" r="12"/>
<circle cx="336" cy="256" r="12"/>
<circle cx="448" cy="256" r="12"/>
<circle cx="80" cy="392" r="12"/>
<circle cx="192" cy="392" r="12"/>
<circle cx="320" cy="392" r="12"/>
<circle cx="432" cy="392" r="12"/>
</g>
</defs>
<rect x="28" y="84" width="456" height="344" rx="28" fill="#357CB9" fill-opacity="0.2" stroke="#357CB9" stroke-width="8"/>
