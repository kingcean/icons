<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Metallic bond</title>
<desc>Coral positive metal-ion cores form an orderly array in a shared translucent blue electron region. Small amber dots represent delocalized electrons rather than localized electron pairs.</desc>
