<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Special relativity</title>
<desc>Matching blue mirror pairs form two light clocks. Amber light travels vertically in the stationary clock and along a diagonal reflected path in the moving clock, viewed from the stationary frame. A violet motion arrow emphasizes time dilation.</desc>
